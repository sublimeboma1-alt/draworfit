<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Paiement sécurisé</title><link rel="stylesheet" href="/styles.css"/></head><body><main><p class="eyebrow">PAIEMENT SÉCURISÉ</p><h1>Finaliser votre achat</h1><p>Vous serez redirigé vers la page de paiement sécurisée Chariow.</p><form id="checkout-form"><label>Identifiant ou slug du produit<input name="product_id" required placeholder="prd_abc123"/></label><div class="two"><label>Prénom<input name="first_name" required/></label><label>Nom<input name="last_name" required/></label></div><label>E-mail<input name="email" type="email" required/></label><div class="two"><label>Code pays ISO<input name="country_code" required value="FR" maxlength="2"/></label><label>Téléphone<input name="phone_number" inputmode="tel" required/></label></div><label>Code promo <small>(facultatif)</small><input name="discount_code"/></label><p id="message" role="alert"></p><button id="submit">Continuer vers le paiement</button></form></main><script src="/app.js"></script></body></html>
